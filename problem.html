<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problem - Az-Math</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/problem-page.css" />
  
  <!-- MathJax Configuration -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']],
        processEscapes: true
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  
  <script type="module" src="js/main.js" defer></script>
  <script type="module" src="js/menu.js" defer></script>
  <script type="module" src="js/problem.js" defer></script>
</head>
<body>
  <header class="navbar">
    <div class="nav-left">
      <button class="hamburger" id="menu-toggle">☰</button>
      <span class="site-title">Az-Math</span>
    </div>
    <div class="nav-right">
      <img src="assets/img/defaultprofile.png" class="profile-icon" id="profile-photo">
    </div>
  </header>

  <nav class="sidebar" id="sidebar">
    <ul>
      <li><a href="index.html">🏠 Home</a></li>
      <li><a href="problems.html">📝 Problems</a></li>
      <li><a href="lessons.html">📚 Lessons</a></li>
      <li><a href="profile.html">👤 Profile</a></li>
    </ul>
  </nav>

  <div id="menu"></div>

  <main class="content problem-page-content">
    <div class="problem-detail problem-detail-compact">
      <!-- Compact Header -->
      <div class="problem-detail-header problem-header-compact">
        <h1 id="problem-title">Loading...</h1>
        <div class="problem-meta-compact">
          <span id="problem-id" class="meta-item-compact"></span>
          <span id="problem-category" class="meta-item-compact"></span>
          <span id="problem-difficulty" class="meta-item-compact"></span>
        </div>
        <div id="problem-tags" class="problem-tags problem-tags-compact"></div>
      </div>

      <!-- Problem Statement -->
      <div class="section section-compact">
        <h2 class="section-title-compact">Problem Statement</h2>
        <div id="problem-statement" class="content-blocks content-blocks-compact"></div>
      </div>

      <!-- Solutions -->
      <div class="section section-compact">
        <div class="section-header-inline">
          <h2 class="section-title-compact">Solutions</h2>
          <button id="toggle-solutions" class="btn btn-small btn-toggle">👁️ Show</button>
        </div>
        <div id="solutions-container" style="display:none;" class="solutions-compact"></div>
      </div>

      <!-- Related Lessons -->
      <div class="section section-compact" id="lessons-section" style="display:none;">
        <h2 class="section-title-compact">Related Lessons</h2>
        <ul id="lesson-list" class="ref-list ref-list-compact"></ul>
      </div>

      <!-- Compact Footer Metadata -->
      <div class="problem-footer-meta">
        <span class="footer-meta-item">
          <span class="meta-icon">✍️</span>
          <span id="problem-author">Unknown</span>
        </span>
        <span class="footer-meta-item">
          <span class="meta-icon">📅</span>
          <span id="problem-timestamp">Unknown</span>
        </span>
        <a href="problems.html" class="btn btn-small btn-secondary">← Back</a>
      </div>
    </div>
  </main>
</body>
</html>
