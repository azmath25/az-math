<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Problems - Az-Math</title>
  <link rel="stylesheet" href="css/minimal-style.css">
  
  <!-- MathJax Configuration -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']],
        processEscapes: true
      },
      svg: {
        fontCache: 'global',
        scale: 0.95  // Slightly smaller for better fit
      },
      options: {
        menuOptions: {
          settings: {
            zoom: 'NoZoom'  // Prevent zoom that breaks layout
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  
  <!-- Math scaling for mobile devices -->
  <style>
    /* Mobile-specific math scaling */
    @media (max-width: 640px) {
      .MathJax {
        font-size: 0.85em !important;
      }
      
      /* Ensure math content wraps and doesn't overflow */
      .problem-body mjx-container {
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        display: block;
      }
      
      /* Compact problem cards on mobile */
      .problem-card-wide {
        padding: 10px;
        font-size: 0.9rem;
      }
      
      .problem-body {
        font-size: 0.9rem;
        line-height: 1.5;
      }
      
      /* Make tags smaller on mobile */
      .tag {
        font-size: 0.75rem;
        padding: 3px 6px;
      }
    }
    
    /* Very small devices (< 400px) */
    @media (max-width: 400px) {
      .MathJax {
        font-size: 0.75em !important;
      }
      
      .problem-card-wide {
        padding: 8px;
        font-size: 0.85rem;
      }
      
      .problem-body {
        font-size: 0.85rem;
      }
    }
    
    /* Horizontal scroll for long equations */
    mjx-container[display="true"] {
      overflow-x: auto;
      overflow-y: hidden;
      max-width: 100%;
    }
  </style>
  
  <script type="module" src="js/main.js" defer></script>
  <script type="module" src="js/menu.js" defer></script>
  <script type="module" src="js/problems.js" defer></script>
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <button class="hamburger" id="menu-toggle">☰</button>
      <span class="site-title">Az-Math</span>
    </div>
    <div class="nav-right">
      <img src="assets/img/defaultprofile.png" alt="Profile" class="profile-icon" id="profile-photo">
    </div>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="lessons.html">Lessons</a></li>
      <li><a href="profile.html">Profile</a></li>
    </ul>
  </nav>

  <!-- Dynamic Menu -->
  <div id="menu"></div>

  <main class="content">
    <h1>Math Problems</h1>
    
    <!-- Search and Filters -->
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search problems by title, tags, or content...">
      
      <div class="filters">
        <select id="category-filter">
          <option value="">All Categories</option>
          <option value="Algebra">Algebra</option>
          <option value="Geometry">Geometry</option>
          <option value="Number Theory">Number Theory</option>
          <option value="Combinatorics">Combinatorics</option>
        </select>
        
        <select id="difficulty-filter">
          <option value="">All Difficulties</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
      </div>
    </div>

    <!-- Problems List -->
    <div id="problems-list" class="problems-wide-list">
      <!-- Problems will be loaded by JS -->
      <!-- Example structure for reference: -->

        </div>
      </div>
      -->
    </div>
    
    <!-- Pagination -->
    <div class="pagination">
      <button id="prev-page" class="btn btn-secondary" disabled>← Previous</button>
      <span id="page-info">Page 1</span>
      <button id="next-page" class="btn btn-secondary">Next →</button>
    </div>
  </main>
</body>
</html>
