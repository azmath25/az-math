<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Problems - Az-Math</title>
  <link rel="stylesheet" href="css/minimal-style.css">
  <link rel="stylesheet" href="css/problems-compact.css">
  
  <!-- MathJax Configuration -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']],
        processEscapes: true
      },
      svg: {
        fontCache: 'global',
        scale: 0.95
      },
      options: {
        menuOptions: {
          settings: {
            zoom: 'NoZoom'
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  
  <script type="module" src="js/main.js" defer></script>
  <script type="module" src="js/menu.js" defer></script>
  <script type="module" src="js/problems.js" defer></script>
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <button class="hamburger" id="menu-toggle">☰</button>
      <span class="site-title">Az-Math</span>
    </div>
    <div class="nav-right">
      <img src="assets/img/defaultprofile.png" alt="Profile" class="profile-icon" id="profile-photo">
    </div>
  </header>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="lessons.html">Lessons</a></li>
      <li><a href="profile.html">Profile</a></li>
    </ul>
  </nav>

  <!-- Dynamic Menu -->
  <div id="menu"></div>

  <main class="content">
    <h1>Məsələlər</h1>
    
    <!-- Search and Filters -->
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search problems by title, tags, or content...">
      
      <div class="filters">
        <select id="category-filter">
          <option value="">All Categories</option>
          <option value="Algebra">Algebra</option>
          <option value="Geometry">Geometry</option>
          <option value="Number Theory">Number Theory</option>
          <option value="Combinatorics">Combinatorics</option>
        </select>
        
        <select id="difficulty-filter">
          <option value="">All Difficulties</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
      </div>
    </div>

    <!-- Problems List -->
    <div id="problems-list" class="problems-wide-list">
      <!-- Problems will be loaded by JS -->
      <!-- Example structure: -->
      <!--
      <a href="problem.html?id=1" class="problem-card-compact">
        <div class="problem-title-line">
          <span class="problem-id-inline">#1</span>Find the value of x
        </div>
        <div class="problem-metadata-line">
          <span class="meta-category">Algebra</span>
          <span class="meta-difficulty easy">Easy</span>
          <span class="meta-tag">equations</span>
          <span class="meta-tag">linear</span>
        </div>
        <div class="problem-body">
          <p>Solve for x: $2x + 5 = 13$</p>
        </div>
      </a>
      -->
    </div>
    
    <!-- Pagination -->
    <div class="pagination">
      <button id="prev-page" class="btn btn-secondary" disabled>← Previous</button>
      <span id="page-info">Page 1</span>
      <button id="next-page" class="btn btn-secondary">Next →</button>
    </div>
  </main>

  <script>
    // Menu toggle
    document.getElementById('menu-toggle')?.addEventListener('click', () => {
      document.getElementById('sidebar')?.classList.toggle('open');
    });

    // Close sidebar when clicking outside
    document.addEventListener('click', (e) => {
      const sidebar = document.getElementById('sidebar');
      const menuToggle = document.getElementById('menu-toggle');
      if (sidebar?.classList.contains('open') && 
          !sidebar.contains(e.target) && 
          !menuToggle?.contains(e.target)) {
        sidebar.classList.remove('open');
      }
    });
  </script>
</body>
</html>
